name: Build MAINTAIN AI IoT Gateway

on:
  push:
    branches: [main, implementation6]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "MAINTAIN AI IoT Gateway" gateway.py

      - name: Read application version
        shell: pwsh
        run: |
          $line = Select-String -Path gateway/__init__.py -Pattern '__version__' | Select-Object -First 1
          if (-not $line) { throw 'Could not find __version__ in gateway/__init__.py' }
          $version = [regex]::Match($line.Line, '"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Could not parse application version' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building version $version"

      # Public-trust signing is enabled only for pushes to main.
      # Pull requests continue to build normally without requiring Azure credentials.
      - name: Azure login for Artifact Signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $file = 'dist\MAINTAIN AI IoT Gateway.exe'
          $sig = Get-AuthenticodeSignature $file
          if ($sig.Status -ne 'Valid') {
            throw "Executable signature is not valid: $($sig.Status)"
          }
          Write-Host "Executable signed by: $($sig.SignerCertificate.Subject)"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer\maintain-ai-iot-gateway.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installer\installer-output
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $file = 'installer\installer-output\MAINTAIN-AI-IoT-Gateway-Setup.exe'
          $sig = Get-AuthenticodeSignature $file
          if ($sig.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($sig.Status)"
          }
          Write-Host "Installer signed by: $($sig.SignerCertificate.Subject)"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-windows
          path: 'dist/MAINTAIN AI IoT Gateway.exe'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-installer
          path: 'installer/installer-output/MAINTAIN-AI-IoT-Gateway-Setup.exe'
