name: Release Linux Gateway

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux \${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
          - arch: amd64
            runner: ubuntu-24.04
            deb_arch: amd64
    runs-on: \${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1 libfreetype6 libsecret-1-0 dpkg-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.7.3" "pyserial>=3.5,<4" "requests>=2.32,<3" "keyring>=25,<26" pyinstaller
      - name: Read version
        run: echo "APP_VERSION=$(python -c "from gateway import __version__; print(__version__)")" >> "$GITHUB_ENV"
      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "maintain-ai-iot-gateway" gateway.py
          test -s dist/maintain-ai-iot-gateway
      - name: Build Debian package
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/DEBIAN package/usr/bin package/usr/share/applications
          install -m 0755 dist/maintain-ai-iot-gateway package/usr/bin/maintain-ai-iot-gateway
          cat > package/usr/share/applications/maintain-ai-iot-gateway.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MAINTAIN AI IoT Gateway
          Comment=MAINTAIN AI physical machine telemetry gateway
          Exec=/usr/bin/maintain-ai-iot-gateway
          Terminal=false
          Categories=Utility;Network;
          EOF
          chmod 0644 package/usr/share/applications/maintain-ai-iot-gateway.desktop
          cat > package/DEBIAN/control <<EOF
          Package: maintain-ai-iot-gateway
          Version: $APP_VERSION
          Section: utils
          Priority: optional
          Architecture: \${{ matrix.deb_arch }}
          Maintainer: MAINTAIN AI
          Description: MAINTAIN AI IoT Gateway
           Desktop gateway for physical machine telemetry and serial-connected devices.
          Depends: libc6, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxcb-xinerama0, libxcb-xkb1, libdbus-1-3, libfontconfig1, libfreetype6, libsecret-1-0
          EOF
          dpkg-deb --build --root-owner-group package "MAINTAIN-AI-IoT-Gateway-$APP_VERSION-linux-\${{ matrix.arch }}.deb"
          dpkg-deb --info "MAINTAIN-AI-IoT-Gateway-$APP_VERSION-linux-\${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-\${{ matrix.arch }}
          path: "MAINTAIN-AI-IoT-Gateway-\${{ env.APP_VERSION }}-linux-\${{ matrix.arch }}.deb"

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: release-assets
      - name: Create stable asset names
        run: |
          set -e
          arm64=$(find release-assets -name '*linux-arm64.deb' | head -n1)
          amd64=$(find release-assets -name '*linux-amd64.deb' | head -n1)
          test -n "$arm64" && test -n "$amd64"
          cp "$arm64" release-assets/MAINTAIN-AI-IoT-Gateway-linux-arm64.deb
          cp "$amd64" release-assets/MAINTAIN-AI-IoT-Gateway-linux-amd64.deb
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/MAINTAIN-AI-IoT-Gateway-linux-arm64.deb
            release-assets/MAINTAIN-AI-IoT-Gateway-linux-amd64.deb
