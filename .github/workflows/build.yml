name: Build MAINTAIN AI IoT Gateway

on:
  push:
    branches: [main, implementation6]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  build-windows:
    runs-on: windows-latest
    needs: test
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "MAINTAIN AI IoT Gateway" gateway.py

      - name: Read application version
        shell: pwsh
        run: |
          $line = Select-String -Path gateway/__init__.py -Pattern '__version__' | Select-Object -First 1
          if (-not $line) { throw 'Could not find __version__ in gateway/__init__.py' }
          $version = [regex]::Match($line.Line, '"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Could not parse application version' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building version $version"

      - name: Select Windows signing mode
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ($env:SIGNPATH_ORGANIZATION_ID -and $env:SIGNPATH_PROJECT_SLUG -and $env:SIGNPATH_SIGNING_POLICY_SLUG -and $env:SIGNPATH_API_TOKEN) {
            Write-Host "SignPath configuration detected: release artifacts will be signed."
          } else {
            Write-Host "SignPath configuration not complete: building unsigned Windows artifacts (legacy install path)."
          }
      # Sign the standalone EXE first so the installer embeds the signed copy.
      - name: Upload unsigned Windows executable
        id: upload-unsigned-exe
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-exe-unsigned
          path: 'dist/MAINTAIN AI IoT Gateway.exe'
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows executable with SignPath
        id: sign-exe
        if: env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
          wait-for-completion-timeout-in-seconds: 900

      - name: Replace executable with signed copy
        if: env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed-exe -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return a signed executable.' }
          Copy-Item -Path $signed.FullName -Destination 'dist/MAINTAIN AI IoT Gateway.exe' -Force
          $signature = Get-AuthenticodeSignature -FilePath 'dist/MAINTAIN AI IoT Gateway.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows EXE Authenticode signature is not valid: $($signature.Status)"
          }
          Write-Host "Signed EXE: $($signature.SignerCertificate.Subject)"

      - name: Upload unsigned Windows executable for development
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-windows-unsigned-development
          path: 'dist/MAINTAIN AI IoT Gateway.exe'
          if-no-files-found: error
          retention-days: 7

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer\maintain-ai-iot-gateway.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = 'installer\installer-output\MAINTAIN-AI-IoT-Gateway-Setup.exe'
          if (-not (Test-Path $installer)) { throw "Installer was not created at $installer" }
          Write-Host "Created installer: $installer"

      - name: Upload unsigned Windows installer
        id: upload-unsigned-installer
        if: env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-installer-unsigned
          path: 'installer/installer-output/MAINTAIN-AI-IoT-Gateway-Setup.exe'
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installer with SignPath
        id: sign-installer
        if: env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
          wait-for-completion-timeout-in-seconds: 900

      - name: Verify signed Windows installer
        if: env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path signed-installer -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'SignPath did not return a signed installer.' }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer Authenticode signature is not valid: $($signature.Status)"
          }
          Write-Host "Signed installer: $($signature.SignerCertificate.Subject)"

      - name: Upload signed Windows executable
        if: env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-windows
          path: 'dist/MAINTAIN AI IoT Gateway.exe'
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Windows installer
        if: env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-installer
          path: 'signed-installer/**/*.exe'
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Windows installer for development
        if: env.SIGNPATH_ORGANIZATION_ID == '' || env.SIGNPATH_PROJECT_SLUG == '' || env.SIGNPATH_SIGNING_POLICY_SLUG == '' || env.SIGNPATH_API_TOKEN == ''
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-installer-unsigned-development
          path: 'installer/installer-output/MAINTAIN-AI-IoT-Gateway-Setup.exe'
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
          - arch: amd64
            runner: ubuntu-24.04
            deb_arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libsecret-1-0 \
            dpkg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # PySide6 6.7.3 publishes manylinux_2_28 ARM64/x86-64 wheels, keeping this artifact suitable for Raspberry Pi OS Bookworm.
          python -m pip install "PySide6==6.7.3" "pyserial>=3.5,<4" "requests>=2.32,<3" "keyring>=25,<26" pyinstaller

      - name: Read application version
        shell: bash
        run: |
          VERSION=$(python -c "from gateway import __version__; print(__version__)")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building MAINTAIN AI IoT Gateway $VERSION for Linux ${{ matrix.arch }}"

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "maintain-ai-iot-gateway" gateway.py
          test -f "dist/maintain-ai-iot-gateway"

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          PKG="package"
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/usr/bin"
          mkdir -p "$PKG/usr/share/applications"
          install -m 0755 "dist/maintain-ai-iot-gateway" "$PKG/usr/bin/maintain-ai-iot-gateway"
          cat > "$PKG/usr/share/applications/maintain-ai-iot-gateway.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MAINTAIN AI IoT Gateway
          Comment=MAINTAIN AI physical machine telemetry gateway
          Exec=/usr/bin/maintain-ai-iot-gateway
          Terminal=false
          Categories=Utility;Network;
          EOF
          chmod 0644 "$PKG/usr/share/applications/maintain-ai-iot-gateway.desktop"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: maintain-ai-iot-gateway
          Version: $APP_VERSION
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: MAINTAIN AI
          Description: MAINTAIN AI IoT Gateway
           Desktop gateway for physical machine telemetry and serial-connected devices.
          Depends: libc6, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxcb-xinerama0, libxcb-xkb1, libdbus-1-3, libfontconfig1, libfreetype6, libsecret-1-0
          EOF
          dpkg-deb --build --root-owner-group "$PKG" "MAINTAIN-AI-IoT-Gateway-${APP_VERSION}-linux-${{ matrix.arch }}.deb"

      - name: Validate package
        shell: bash
        run: |
          dpkg-deb --info "MAINTAIN-AI-IoT-Gateway-${APP_VERSION}-linux-${{ matrix.arch }}.deb"
          dpkg-deb --contents "MAINTAIN-AI-IoT-Gateway-${APP_VERSION}-linux-${{ matrix.arch }}.deb"
          file "dist/maintain-ai-iot-gateway"
          test -s "MAINTAIN-AI-IoT-Gateway-${APP_VERSION}-linux-${{ matrix.arch }}.deb"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-iot-gateway-linux-${{ matrix.arch }}
          path: "MAINTAIN-AI-IoT-Gateway-${{ env.APP_VERSION }}-linux-${{ matrix.arch }}.deb"
          if-no-files-found: error
          retention-days: 14
